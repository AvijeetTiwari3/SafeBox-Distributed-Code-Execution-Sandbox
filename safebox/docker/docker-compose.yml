version: '3.8'

services:
  redis:
    image: redis:7.2-alpine
    container_name: safebox-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  safebox-api:
    build:
      context: ..
      dockerfile: safebox/docker/Dockerfile
    container_name: safebox-api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - SAFEBOX_POOL_SIZE=5
    depends_on:
      redis:
        condition: service_healthy
    security_opt:
      - seccomp:../profiles/seccomp-strict.json
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: safebox-prometheus
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
